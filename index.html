<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NBA Wins Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: a draft-room board. Sticky header with tabs, one working panel below; the leaderboard reads like a scoreboard, the draft like a magnet board. */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --sunk:#E3E8F0; --ink:#13203A; --muted:#5B6782; --line:#D3DAE6;
  --accent:#E8601C; --accent-soft:#FDE6D8; --accent-ink:#FFFFFF; --good:#1F8A4C; --bad:#B4372C;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#161F31; --sunk:#1D283D; --ink:#E7ECF5; --muted:#93A0B8; --line:#2A3650;
  --accent:#FF8A45; --accent-soft:#3A2618; --accent-ink:#1A0F07; --good:#4CC27E; --bad:#F07A6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#161F31; --sunk:#1D283D; --ink:#E7ECF5; --muted:#93A0B8; --line:#2A3650;
  --accent:#FF8A45; --accent-soft:#3A2618; --accent-ink:#1A0F07; --good:#4CC27E; --bad:#F07A6E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px 0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,40px);line-height:.95;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 span{color:var(--accent)}
.season{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:10px}
nav a{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:8px 14px 10px;border-bottom:3px solid transparent;white-space:nowrap}
nav a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:22px 60px}
h2{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.label{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:18px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.05)}
button.danger{color:var(--bad);border-color:var(--bad);background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
.num{font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1.5px var(--surface),0 0 0 2.5px var(--line);flex:none}
.empty{padding:36px 18px;text-align:center}
.empty p{max-width:46ch;margin:8px auto 16px}

/* Leaderboard */
.board{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.rank{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:var(--muted);text-align:center}
.lrow.lead .rank{color:var(--accent)}
.pname{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:999px;padding:3px 10px 3px 7px;font-size:13px;font-weight:600;white-space:nowrap}
.chip .rec{color:var(--muted);font-weight:500}
.tot{display:flex;gap:18px;align-items:flex-end;text-align:right}
.big{font-family:var(--display);font-weight:800;font-size:40px;line-height:.9}
.stat .label{display:block;margin-bottom:3px}
.stat .v{font-weight:700;font-size:16px}
.delta{display:inline-block;font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.delta.up{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
@media (max-width:620px){
  .lrow{grid-template-columns:36px minmax(0,1fr)}
  .tot{grid-column:2;justify-content:flex-start;text-align:left;flex-wrap:wrap;gap:10px 16px}
  .rank{font-size:28px}
}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tname{display:flex;align-items:center;gap:8px}

/* Draft */
.clock{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:18px 20px}
.clock .label{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.clock .who{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,46px);line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.clock .who em{font-style:normal;color:var(--accent)}
.clock .pk{font-family:var(--display);font-weight:600;font-size:22px;text-align:right;white-space:nowrap}
.confirm{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 16px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px}
.tbtn{display:flex;align-items:center;gap:9px;text-align:left;padding:10px 12px;font-weight:600;min-width:0}
.tbtn .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.tbtn .rk{color:var(--muted);font-size:12px;width:18px;text-align:right;flex:none}
.tbtn .pj{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;text-align:right;flex:none}
.tbtn .pj small{display:block;font-family:var(--body);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.tbtn small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tbtn.taken{opacity:.42;cursor:not-allowed;background:var(--sunk)}
.dboard th,.dboard td{text-align:center}
.dboard th:first-child,.dboard td:first-child{text-align:left;color:var(--muted);font-weight:600}
.cell{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.cell.now{color:var(--accent)}
.cell.open{color:var(--line)}
.conf-tabs{display:flex;gap:6px}
.seg{border-radius:999px;padding:6px 14px;font-size:13px}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Setup */
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto auto;gap:6px;align-items:center}
.prow .n{font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted);text-align:center}
.prow button{padding:7px 10px}
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:end}
.opts label{display:flex;flex-direction:column;gap:5px}
.note{font-size:13.5px;color:var(--muted);max-width:68ch}
@media (max-width:480px){
  nav{gap:0;margin-left:-6px}
  nav a{font-size:15px;padding:8px 7px 10px;letter-spacing:.02em}
  .hide-sm{display:none}
  td,th{padding:9px 8px}
  .tname{white-space:normal;min-width:120px}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.inline-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.lrow,.tbtn{transition:background .15s,border-color .15s}}

/* Daily roast */
.roast{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:16px 20px;border-left:6px solid var(--accent)}
.roast .label{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.roast .tag{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);line-height:1.1}
.roast .tag b{display:block;font-size:26px;color:var(--bg);overflow-wrap:anywhere}
.roast q{font-size:clamp(16px,2.4vw,19px);font-weight:600;line-height:1.35;quotes:"\201C" "\201D"}
@media (max-width:620px){.roast{grid-template-columns:1fr}}

/* Charts — categorical slots, fixed order (validated palette) */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--grid:#E3E8F0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--grid:#222D44}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--grid:#222D44}
.chart-box{position:relative;padding:14px 12px 8px}
.chart-box svg{display:block;width:100%;height:auto;overflow:visible}
.chart-box .ax{font-size:11.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart-box .dl{font-size:12px;font-weight:700;fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 4px}
.legend span{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.12);min-width:150px;z-index:2}
.tip .h{font-weight:700;margin-bottom:4px}
.tip div.r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip div.r span{display:inline-flex;align-items:center;gap:6px}
.tip i{width:10px;height:3px;border-radius:2px;display:inline-block}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpi{padding:14px 16px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,30px);line-height:1.05;overflow-wrap:anywhere}
.kpi .muted{font-size:13px}

/* Matchups */
.mcard{padding:18px;display:flex;flex-direction:column;gap:12px}
.mtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.side{display:flex;flex-direction:column;gap:2px;min-width:0}
.side.home{text-align:right;align-items:flex-end}
.side .tm{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:24px;line-height:1;text-transform:uppercase}
.side .own{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.at{font-family:var(--display);font-weight:600;color:var(--muted);font-size:18px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px}
.out{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:14px}
.out b{display:block;margin-bottom:2px}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hrow">
      <div>
        <div class="season" id="seasonLbl">2026–27 Regular Season</div>
        <h1>NBA Wins <span>Draft</span></h1>
      </div>
      <div style="text-align:right"><div class="label" id="asOf"></div><div class="label" id="who" style="margin-top:4px"></div></div>
    </div>
    <nav id="nav" aria-label="Sections">
      <a href="#board" data-tab="board">Leaderboard</a>
      <a href="#matchups" data-tab="matchups">Matchup<span class="hide-sm"> of the Day</span></a>
      <a href="#analytics" data-tab="analytics">Analytics</a>
      <a href="#draft" data-tab="draft">Draft</a>
      <a href="#teams" data-tab="teams"><span class="hide-sm">All </span>Teams</a>
      <a href="#setup" data-tab="setup"><span class="hide-sm">League </span>Setup</a>
    </nav>
  </div>
</header>

<main class="wrap" id="main">
  <div class="panel empty" id="loading">
    <h2>Loading the league</h2>
    <p class="muted">Pulling the draft board and the latest win totals.</p>
  </div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
const TEAMS = [
 ["ATL","Atlanta Hawks","E","#E03A3E"],["BOS","Boston Celtics","E","#007A33"],["BKN","Brooklyn Nets","E","#6B6B6B"],
 ["CHA","Charlotte Hornets","E","#00788C"],["CHI","Chicago Bulls","E","#CE1141"],["CLE","Cleveland Cavaliers","E","#860038"],
 ["DET","Detroit Pistons","E","#C8102E"],["IND","Indiana Pacers","E","#FDBB30"],["MIA","Miami Heat","E","#98002E"],
 ["MIL","Milwaukee Bucks","E","#00471B"],["NYK","New York Knicks","E","#F58426"],["ORL","Orlando Magic","E","#0077C0"],
 ["PHI","Philadelphia 76ers","E","#006BB6"],["TOR","Toronto Raptors","E","#CE1141"],["WAS","Washington Wizards","E","#E31837"],
 ["DAL","Dallas Mavericks","W","#00538C"],["DEN","Denver Nuggets","W","#FEC524"],["GSW","Golden State Warriors","W","#1D428A"],
 ["HOU","Houston Rockets","W","#CE1141"],["LAC","LA Clippers","W","#1D428A"],["LAL","Los Angeles Lakers","W","#552583"],
 ["MEM","Memphis Grizzlies","W","#5D76A9"],["MIN","Minnesota Timberwolves","W","#236192"],["NOP","New Orleans Pelicans","W","#85714D"],
 ["OKC","Oklahoma City Thunder","W","#007AC1"],["PHX","Phoenix Suns","W","#E56020"],["POR","Portland Trail Blazers","W","#E03A3E"],
 ["SAC","Sacramento Kings","W","#5A2D81"],["SAS","San Antonio Spurs","W","#8A9599"],["UTA","Utah Jazz","W","#753BBD"]
].map(([a,n,c,col])=>({a,n,c,col}));
const T = Object.fromEntries(TEAMS.map(t=>[t.a,t]));
// Preseason win-total lines, Fanatics Sportsbook, published Oct 16, 2026
const LINE = {ATL:43.5,BOS:51.5,BKN:24.5,CHA:39.5,CHI:29.5,CLE:48.5,DAL:34.5,DEN:49.5,DET:49.5,GSW:39.5,HOU:48.5,IND:44.5,LAC:27.5,LAL:46.5,MEM:28.5,MIA:46.5,MIL:26.5,MIN:48.5,NOP:27.5,NYK:52.5,OKC:60.5,ORL:43.5,PHI:50.5,PHX:40.5,POR:43.5,SAC:20.5,SAS:59.5,TOR:45.5,UTA:35.5,WAS:35.5};
const LINE_SRC = "Preseason lines: Fanatics Sportsbook, Oct 16, 2026";

const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dot = a=>`<span class="dot" style="background:${T[a]?.col||'#999'}"></span>`;

let role=null, netErr=false;
const canWriteF=()=>!!role, canAdminF=()=>role==="admin";
let league=null, leagueLoaded=false, standings=null, history=[];
let tab=null, selTeam=null, confFilter="ALL", editWins=false, confirmReset=false, confirmUndo=false;
let draftForm=null; // setup form state
let slate=null, chartMode="league", roast=null;

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}

/* ---------- derived data ---------- */
// Snake with a third-round reversal: R1 1→N, R2 N→1, R3 N→1, then alternating (R4 1→N)
const forward = r => r===0 || (r>=3 && r%2===1);
const roundsFor = n => n>6?3:4;
function rec(a){const r=standings?.teams?.[a];return {w:+(r?.w||0),l:+(r?.l||0)}}
// Expected wins: wins so far plus remaining games at the preseason line's pace
function proj(a){const r=rec(a),gp=r.w+r.l;return r.w+Math.max(0,82-gp)*(LINE[a]/82)}
const f1=x=>x.toFixed(1);
function pickInfo(idx){
  const n=league.players.length, round=Math.floor(idx/n), pos=idx%n;
  return {round, pos, player: forward(round)?pos:n-1-pos};
}
function ownerOf(a){
  if(!league?.picks) return null;
  const p=league.picks.find(x=>x.t===a);return p?league.players[p.p]:null;
}
function playerTeams(i){return (league?.picks||[]).filter(p=>p.p===i).map(p=>p.t)}
function histTotals(h){
  // totals per player from a history doc
  return league.players.map((_,i)=>playerTeams(i).reduce((s,a)=>s+(+(h.teams?.[a]?.w||0)),0));
}
function leaderboard(){
  const prev = previousSnapshot();
  const prevTot = prev?histTotals(prev):null;
  const rows = league.players.map((name,i)=>{
    const teams=playerTeams(i); let w=0,l=0,pj=0;
    teams.forEach(a=>{const r=rec(a);w+=r.w;l+=r.l;pj+=proj(a)});
    return {name,i,teams,w,l,pj,pct:(w+l)?w/(w+l):0,delta:prevTot?w-prevTot[i]:null};
  });
  rows.sort((x,y)=>y.w-x.w||x.l-y.l||x.name.localeCompare(y.name));
  const lead=rows[0];
  rows.forEach((r,k)=>{
    r.gb = lead?lead.w-r.w:0;
    r.rank = (k>0 && rows[k-1].w===r.w && rows[k-1].l===r.l)?rows[k-1].rank:k+1;
  });
  return rows;
}
function previousSnapshot(){
  if(!history.length||!standings?.asOf) return null;
  const older=history.filter(h=>h.date<standings.asOf);
  return older.length?older[older.length-1]:null;
}
const fmtPct = p=>p.toFixed(3).replace(/^0/,"");
const fmtGB = g=>g===0?"—":(g%1?g.toFixed(1):String(g));
function fmtDate(iso){if(!iso)return"";const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

/* ---------- views ---------- */
let canWrite=false, canAdmin=false;
let me=null; try{me=localStorage.getItem("nbawd-me")}catch{}
function unlockBox(msg){return `<div class="panel pad" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="note" style="flex:1 1 220px">${msg}</span><input id="pw" type="password" placeholder="Password" autocomplete="current-password" style="flex:1 1 160px"><button class="primary" id="unlockBtn">Unlock</button></div>`}
function vBoard(){
  if(!league) return noLeague();

    <p class="muted">The leaderboard fills in once all ${league.players.length*league.rounds} picks are made. ${league.picks.length} made so far.</p>
    <a class="btn" href="#draft">Go to the draft</a></div>`;
  const rows=leaderboard();
  const prev=previousSnapshot();
  let html=`<div class="stack">${vRoast(rows)}
   <div class="sec-head"><h2>Standings</h2><span class="label">Ranked by total wins · ties go to fewer losses</span></div>
   <div class="panel board">`+rows.map(r=>`
    <div class="lrow ${r.rank===1&&r.w>0?"lead":""}">
      <div class="rank num">${r.rank}</div>
      <div style="min-width:0">
        <div class="pname">${esc(r.name)}${r.name===me?' <span class="delta up">you</span>':""}</div>
        <div class="chips">${r.teams.map(a=>{const x=rec(a);return `<span class="chip" title="${esc(T[a].n)}">${dot(a)}${a} <span class="rec num">${x.w}-${x.l}</span></span>`}).join("")}</div>
      </div>
      <div class="tot">
        <div class="stat"><span class="label">Wins</span><div class="big num">${r.w}</div></div>
        <div class="stat"><span class="label">Losses</span><div class="v num">${r.l}</div></div>
        <div class="stat"><span class="label">Pct</span><div class="v num">${fmtPct(r.pct)}</div></div>
        <div class="stat"><span class="label">Back</span><div class="v num">${fmtGB(r.gb)}</div></div>
        <div class="stat" title="Wins so far plus remaining games at each team's preseason pace"><span class="label">Exp. wins</span><div class="v num">${f1(r.pj)}</div></div>
        <div class="stat"><span class="label">Last day</span><div><span class="delta num ${r.delta>0?"up":""}">${r.delta==null?"—":"+"+r.delta}</span></div></div>

  html+=vHistory();

}
function vHistory(){
  const days=history.slice(-10);
  if(!days.length) return `<div class="panel pad"><h3>Day by day</h3><p class="muted" style="margin:6px 0 0">Each morning's win totals are logged here once the season's first games are in.</p></div>`;
  const totals=days.map(histTotals);
  const order=leaderboard().map(r=>r.i);
  return `<div class="stack" style="gap:10px"><div class="sec-head"><h3>Day by day</h3><span class="label">Total wins after each day · last ${days.length} days</span></div>
  <div class="panel tbl-wrap"><table><thead><tr><th>Player</th>${days.map(d=>`<th class="r">${fmtDate(d.date)}</th>`).join("")}</tr></thead><tbody>
  ${order.map(i=>`<tr><td><b>${esc(league.players[i])}</b></td>${totals.map((t,k)=>{const ch=k?t[i]-totals[k-1][i]:0;return `<td class="r">${t[i]}${k&&ch>0?` <span class="muted" style="font-size:12px">+${ch}</span>`:""}</td>`}).join("")}</tr>`).join("")}
  </tbody></table></div></div>`;
}
function noLeague(){
  return `<div class="panel empty"><h2>No league yet</h2>
  <p class="muted">Add everyone who's drafting, pick 3 or 4 teams each, and start the snake draft. The leaderboard updates every morning with real NBA win totals.</p>

}

/* ---------- daily roast ---------- */
const nick=ab=>ab==="POR"?"Trail Blazers":T[ab].n.split(" ").slice(-1)[0];
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const ord=n=>n+(["th","st","nd","rd"][(n%100-20)%10]||["th","st","nd","rd"][n%100]||"th");
// g: needs games played · gb: needs games back ≥ 1 · day: needs a day-over-day delta
const ROASTS=[
 {t:c=>`${c.n} drafted the ${c.team} on purpose, sober, with the whole board in front of them, and it still won't be the worst decision they make this year.`},
 {g:1,t:c=>`${c.n} has ${c.w} wins, which is also roughly the number of people who still respect their basketball opinions.`},
 {g:1,t:c=>`If losing were a skill, ${c.n} would finally be good at something.`},
 {g:1,t:c=>`The ${c.team} are ${c.tr}, and ${c.n} still had the nerve to show their face in the group chat today.`},
 {t:c=>`${c.n}'s draft strategy appears to have been "close eyes, point, regret."`},
 {g:1,t:c=>`Rock bottom called and asked ${c.n} to stop digging because they're scaring the neighbors.`},
 {t:c=>`${c.n} is living proof that you can watch basketball for thirty years and learn absolutely nothing.`},
 {t:c=>`Every night the ${c.team} take the floor and remind everyone exactly how ${c.n} makes decisions.`},
 {g:1,t:c=>`${c.n} isn't rebuilding, ${c.n} is just bad, and the standings have stopped being polite about it.`},
 {t:c=>`The best thing ${c.n} drafted this season is a group chat full of people laughing at them.`},
 {g:1,t:c=>`Last place fits ${c.n} so naturally you'd think the standings were tailored for them.`},
 {t:c=>`If ${c.n}'s roster were a stock, the SEC would open an investigation into whoever kept buying it.`},
 {t:c=>`${c.n} drafts like someone who found out the NBA exists from the back of a cereal box.`},
 {t:c=>`The ${c.team} have quietly asked the league office if they can be un-drafted by ${c.n}.`},
 {gb:1,t:c=>`${c.n} is ${c.gb} wins back, which is the only number in their life that keeps going up.`},
 {t:c=>`Somewhere a tanking front office is studying ${c.n}'s roster and taking notes.`},
 {day:1,t:c=>`${c.n} picked up ${c.d} win${c.d===1?"":"s"} yesterday, which is ${c.d} more than they deserved.`},
 {day:1,t:c=>`Everyone else moved forward yesterday while ${c.n} added ${c.d}, a perfect summary of their entire life.`},
 {day:1,t:c=>`${c.n} managed ${c.d} win${c.d===1?"":"s"} yesterday, and the ${c.team} have reportedly started blaming their owner.`},
];
function roastTarget(rows){
  if(rows.length<2) return null;
  if(!rows.some(r=>r.w+r.l>0)) return {r:[...rows].sort((a,b)=>a.pj-b.pj)[0],why:"Lowest expected wins"};
  const wd=rows.filter(r=>r.delta!=null);
  if(wd.length){
    const lo=Math.min(...wd.map(r=>r.delta)),hi=Math.max(...wd.map(r=>r.delta));
    if(hi>lo){const r=wd.filter(x=>x.delta===lo).sort((a,b)=>a.w-b.w||b.l-a.l)[0];return {r,why:"Worst day in the league",day:true}}
  }
  return {r:rows[rows.length-1],why:"Last place"};
}
function vRoast(rows){
  let name,text,why;
  if(roast?.text&&league.players.includes(roast.player)){name=roast.player;text=roast.text;why=roast.why||"Today's target"}
  else{
    const t=roastTarget(rows);if(!t)return "";
    const r=t.r, played=rows.some(x=>x.w+x.l>0);
    const worst=[...r.teams].sort((a,b)=>{const x=rec(a),y=rec(b),px=(x.w+x.l)?x.w/(x.w+x.l):.5,py=(y.w+y.l)?y.w/(y.w+y.l):.5;return px-py||proj(a)-proj(b)})[0];
    const wr=rec(worst);
    const c={n:r.name,team:nick(worst),tr:`${wr.w}-${wr.l}`,w:r.w,gb:Math.floor(r.gb),d:r.delta};
    const pool=ROASTS.filter(x=>(!x.g||played)&&(!x.gb||c.gb>=1)&&(!x.day||t.day));
    const dayPool=t.day?pool.filter(x=>x.day):[];
    const use=dayPool.length&&hashStr(todayISO())%2===0?dayPool:pool;
    name=r.name;why=t.why;text=use[hashStr(todayISO()+"|"+r.name)%use.length].t(c);
  }
  return `<div class="roast"><div class="tag"><span class="label">Daily roast · ${esc(why)}</span><b>${esc(name)}</b></div><q>${esc(text)}</q></div>`;
}

/* ---------- matchup of the day ---------- */
function ownerIdx(a){const p=league?.picks?.find(x=>x.t===a);return p?p.p:-1}
function simRanks(rows,winI,loseI){
  const s=rows.map(r=>({i:r.i,name:r.name,w:r.w+(r.i===winI?1:0),l:r.l+(r.i===loseI?1:0)}));
  s.sort((x,y)=>y.w-x.w||x.l-y.l||x.name.localeCompare(y.name));
  const rk={};s.forEach((r,k)=>{rk[r.i]=(k>0&&s[k-1].w===r.w&&s[k-1].l===r.l)?rk[s[k-1].i]:k+1});return rk;
}
function outcome(rows,topN,winI,loseI){
  const before=Object.fromEntries(rows.map(r=>[r.i,r.rank])),after=simRanks(rows,winI,loseI),out=[];
  const seen=new Set();
  [winI,loseI].forEach(i=>{if(i<0||seen.has(i))return;seen.add(i);const b=before[i],a=after[i],nm=esc(league.players[i]);
    out.push(a<b?`${nm} climbs to ${ord(a)}`:a>b?`${nm} slips to ${ord(a)}`:`${nm} holds ${ord(a)}`)});
  rows.slice(0,topN).forEach(r=>{if(!seen.has(r.i)&&after[r.i]>before[r.i])out.push(`${esc(r.name)} drops to ${ord(after[r.i])}`)});
  if(winI>=0&&winI!==loseI)out.unshift(`+1 win for ${esc(league.players[winI])}`);
  if(winI>=0&&winI===loseI)out.unshift(`${esc(league.players[winI])} banks a win either way`);
  return out.join(" · ")||"Nobody in the top half moves";
}
function gameWhen(g){
  if(g.state==="post")return "Final";
  if(g.state==="in")return `<span style="color:var(--bad)">● Live</span> · ${esc(g.detail||"")}`;
  return g.start?new Date(g.start).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",timeZoneName:"short"}):esc(g.detail||"");
}
function vMatchups(){
  if(!league) return noLeague();
  if(league.status!=="complete") return `<div class="panel empty"><h2>Draft first</h2><p class="muted">Matchups rank today's NBA games by how much they shake up the top half of the leaderboard, so they start once every team is drafted.</p><a class="btn" href="#draft">Go to the draft</a></div>`;
  const rows=leaderboard(),topN=Math.ceil(rows.length/2),pos=Object.fromEntries(rows.map((r,k)=>[r.i,k]));
  const top=new Set(rows.slice(0,topN).map(r=>r.i));
  const games=Array.isArray(slate?.games)?slate.games.filter(g=>T[g.away]&&T[g.home]):null;
  const dayLbl=slate?.date?(()=>{const [y,m,d]=slate.date.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})})():"Today";
  let html=`<div class="stack"><div class="sec-head"><h2>Matchup of the day</h2><span class="label">${dayLbl} · Top half = ${rows.slice(0,topN).map(r=>esc(r.name)).join(", ")}</span></div>`;
  if(!games) return html+`<div class="panel empty"><h3>Today's schedule hasn't loaded yet</h3><p class="muted">It's pulled from ESPN along with the standings. Refresh in a minute.</p></div></div>`;
  if(!games.length) return html+`<div class="panel empty"><h3>No NBA games today</h3><p class="muted">Nobody's standings move today. Enjoy the quiet.</p></div></div>`;
  const scored=games.map(g=>{
    const a=ownerIdx(g.away),h=ownerIdx(g.home),ta=a>=0&&top.has(a),th=h>=0&&top.has(h);let s=0,kind="";
    if(a>=0&&a===h){s=ta?30:0;kind="Win-win"}
    else if(ta&&th){s=100-Math.abs(rows[pos[a]].w-rows[pos[h]].w)-Math.min(pos[a],pos[h])*2;kind="Top-half showdown"}
    else if(ta||th){const t=ta?a:h,o=ta?h:a;s=60-pos[t]*4+(o>=0?10:0);kind=pos[t]===0?"Leader on the line":o>=0?"Chaser vs. contender":"Contender in action"}
    return {g,a,h,s,kind};
  }).filter(x=>x.s>0).sort((x,y)=>y.s-x.s).slice(0,3);
  if(!scored.length) return html+`<div class="panel empty"><h3>Quiet day at the top</h3><p class="muted">None of today's ${games.length} game${games.length===1?"":"s"} involve a top-half team. The bottom half gets a free shot to close the gap.</p></div></div>`;
  const side=(ab,i,cls)=>{const r=rec(ab),k=i>=0?pos[i]:-1;return `<div class="side ${cls}"><div class="tm">${cls?"":dot(ab)}${ab}${cls?dot(ab):""}</div><div class="muted" style="font-size:13px">${esc(T[ab].n)} · <span class="num">${r.w}-${r.l}</span></div><div class="own">${i>=0?`${esc(league.players[i])} <span class="muted num">· ${ord(rows[k].rank)}</span>`:`<span class="muted">Undrafted</span>`}</div></div>`};
  html+=scored.map((x,k)=>`<div class="panel mcard">
    <div class="mtop"><span class="badge">${k===0?"Game of the day · ":""}${x.kind}</span><span class="label">${gameWhen(x.g)}</span></div>
    <div class="vs">${side(x.g.away,x.a,"")}<div class="at">@</div>${side(x.g.home,x.h,"home")}</div>
    ${x.g.state==="post"&&x.g.winner?`<div class="outs"><div class="out"><b>Final · the ${esc(nick(x.g.winner))} won</b>Already counted in the standings above${ownerIdx(x.g.winner)>=0?`: +1 win for ${esc(league.players[ownerIdx(x.g.winner)])}`:""}.</div></div>`
      :`<div class="outs"><div class="out"><b>If the ${esc(nick(x.g.away))} win</b>${outcome(rows,topN,x.a,x.h)}</div><div class="out"><b>If the ${esc(nick(x.g.home))} win</b>${outcome(rows,topN,x.h,x.a)}</div></div>`}
  </div>`).join("");
  const rest=games.length-scored.length;
  if(rest>0)html+=`<p class="note">${rest} other game${rest===1?"":"s"} on today's slate matter${rest===1?"s":""} less to the top half.</p>`;
  return html+`</div>`;
}

/* ---------- analytics ---------- */
function snapshots(){
  const s=history.map(h=>({date:h.date,teams:h.teams||{}}));
  if(standings?.asOf&&(!s.length||standings.asOf>s[s.length-1].date))s.push({date:standings.asOf,teams:standings.teams||{}});
  return s;
}
const SLOT=i=>`var(--s${i%8+1})`;
let chartMeta=null;
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(Math.max(x,1)))),f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function lineChart(dates,series){
  const box=$("#main"),W=Math.max(300,Math.min(1046,(box?.clientWidth||700)-34)),H=W<560?250:330;
  const direct=series.length<=4,m={l:34,r:direct?Math.min(110,W*.22):14,t:10,b:26};
  const maxV=Math.max(1,...series.flatMap(s=>s.vals)),step=niceStep(maxV/4),yMax=Math.ceil(maxV/step)*step;
  const iw=W-m.l-m.r,ih=H-m.t-m.b,n=dates.length;
  const x=i=>n===1?m.l+iw/2:m.l+i*iw/(n-1),y=v=>m.t+ih-(v/yMax)*ih;
  let g="";
  for(let v=0;v<=yMax;v+=step)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text class="ax" x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const every=Math.max(1,Math.ceil(n/(W<560?4:7)));
  dates.forEach((d,i)=>{if((i%every===0&&n-1-i>=every)||i===n-1)g+=`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="${n===1?"middle":i===0?"start":i===n-1?"end":"middle"}">${fmtDate(d)}</text>`});
  series.forEach(s=>{
    if(n>1)g+=`<path d="${s.vals.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join("")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${s.dash?` stroke-dasharray="6 4"`:""}/>`;
    g+=`<circle cx="${x(n-1)}" cy="${y(s.vals[n-1])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  if(direct){
    const lab=series.map(s=>({s,yy:y(s.vals[n-1])})).sort((a,b)=>a.yy-b.yy);
    for(let k=1;k<lab.length;k++)if(lab[k].yy-lab[k-1].yy<15)lab[k].yy=lab[k-1].yy+15;
    lab.forEach(l=>{const nm=l.s.name.length>12?l.s.name.slice(0,11)+"…":l.s.name;g+=`<text class="dl" x="${x(n-1)+9}" y="${l.yy+4}">${esc(nm)} <tspan class="ax">${l.s.vals[n-1]}</tspan></text>`});
  }
  g+=`<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  g+=`<rect id="hit" x="${m.l-10}" y="0" width="${iw+20}" height="${H}" fill="transparent"/>`;
  chartMeta={W,n,x,dates,series,m,iw};
  const leg=`<div class="legend" aria-hidden="${direct}">${series.map(s=>`<span><i style="background:${s.color}${s.dash?";background:repeating-linear-gradient(90deg,"+s.color+" 0 5px,transparent 5px 8px)":""}"></i>${esc(s.name)}</span>`).join("")}</div>`;
  return `${leg}<div class="chart-box" id="chartBox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of total wins by day">${g}</svg><div class="tip" id="tip" hidden></div></div>`;
}
function wireChart(){
  const box=$("#chartBox");if(!box||!chartMeta)return;const svg=box.querySelector("svg"),tip=$("#tip"),xh=svg.querySelector("#xh");
  const show=e=>{
    const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)*chartMeta.W/r.width,{n,x,dates,series,m,iw}=chartMeta;
    const i=n===1?0:Math.max(0,Math.min(n-1,Math.round((sx-m.l)/(iw/(n-1)))));
    xh.setAttribute("x1",x(i));xh.setAttribute("x2",x(i));xh.setAttribute("visibility","visible");
    const rowsT=series.map(s=>({s,v:s.vals[i],p:i?s.vals[i]-s.vals[i-1]:null})).sort((a,b)=>b.v-a.v);
    tip.innerHTML=`<div class="h">${fmtDate(dates[i])}</div>`+rowsT.map(o=>`<div class="r"><span><i style="background:${o.s.color}"></i>${esc(o.s.name)}</span><b class="num">${o.v}${o.p?` <span class="muted" style="font-weight:500">+${o.p}</span>`:""}</b></div>`).join("");
    tip.hidden=false;
    const px=x(i)*r.width/chartMeta.W,bw=box.clientWidth,tw=tip.offsetWidth;
    tip.style.left=Math.max(4,Math.min(bw-tw-4,px+14>bw-tw-4?px-tw-14:px+14))+"px";tip.style.top="16px";
  };
  const hide=()=>{tip.hidden=true;xh.setAttribute("visibility","hidden")};
  svg.addEventListener("pointermove",show);svg.addEventListener("pointerdown",show);svg.addEventListener("pointerleave",hide);
}
function vAnalytics(){
  if(!league) return noLeague();
  if(league.status!=="complete") return `<div class="panel empty"><h2>Draft first</h2><p class="muted">Charts start once every team has an owner.</p><a class="btn" href="#draft">Go to the draft</a></div>`;
  const snaps=snapshots(),rows=leaderboard();
  let html=`<div class="stack"><div class="sec-head"><h2>Analytics</h2><span class="label">${snaps.length?`${snaps.length} day${snaps.length===1?"":"s"} of results`:""}</span></div>`;
  // KPI tiles
  const pace=rows.map(r=>{let exp=0;r.teams.forEach(a=>{const x=rec(a);exp+=(x.w+x.l)*LINE[a]/82});return {r,diff:r.w-exp}});
  const played=rows.some(r=>r.w+r.l>0);
  if(played){
    const ahead=[...pace].sort((a,b)=>b.diff-a.diff)[0],behind=[...pace].sort((a,b)=>a.diff-b.diff)[0];
    const hot=rows.filter(r=>r.delta!=null).sort((a,b)=>b.delta-a.delta)[0];
    let bestT=null;league.picks.forEach(p=>{const x=rec(p.t);if(!bestT||x.w>bestT.w)bestT={t:p.t,w:x.w,l:x.l,p:p.p}});
    const sg=v=>(v>=0?"+":"−")+Math.abs(v).toFixed(1);
    html+=`<div class="kpis">
      <div class="panel kpi"><span class="label">Most ahead of pace</span><div class="v">${esc(ahead.r.name)}</div><div class="muted num">${sg(ahead.diff)} wins vs. preseason lines</div></div>
      <div class="panel kpi"><span class="label">Furthest behind pace</span><div class="v">${esc(behind.r.name)}</div><div class="muted num">${sg(behind.diff)} wins vs. preseason lines</div></div>
      ${hot?`<div class="panel kpi"><span class="label">Hottest last day</span><div class="v">${esc(hot.name)}</div><div class="muted num">+${hot.delta} wins since ${fmtDate(previousSnapshot()?.date)}</div></div>`:""}
      ${bestT?`<div class="panel kpi"><span class="label">Best drafted team</span><div class="v">${dot(bestT.t)} ${bestT.t} <span class="num">${bestT.w}-${bestT.l}</span></div><div class="muted">Owned by ${esc(league.players[bestT.p])}</div></div>`:""}
    </div>`;
  }
  const segs=`<div class="segs"><button class="seg" data-chart="league" aria-pressed="${chartMode==="league"}">Whole league</button>${league.players.map((p,i)=>`<button class="seg" data-chart="${i}" aria-pressed="${chartMode===String(i)}">${esc(p)}'s teams</button>`).join("")}</div>`;
  html+=`<div class="sec-head"><h3>${chartMode==="league"?"Total wins by player":esc(league.players[+chartMode])+"'s teams · wins"}</h3></div>${segs}`;
  if(!snaps.length) return html+`<div class="panel empty"><h3>No results logged yet</h3><p class="muted">Each morning's win totals are saved here once the season's first games are in, and the lines grow from there.</p></div></div>`;
  const dates=snaps.map(s=>s.date);let series;
  if(chartMode==="league"){
    series=rows.map(r=>r.i).sort((a,b)=>a-b).map(i=>({name:league.players[i],color:SLOT(i),dash:i>=8,vals:snaps.map(s=>playerTeams(i).reduce((t,a)=>t+(+(s.teams[a]?.w||0)),0))}));
  }else{
    series=playerTeams(+chartMode).map((a,k)=>({name:nick(a),color:SLOT(k),vals:snaps.map(s=>+(s.teams[a]?.w||0))}));
  }
  html+=`<div class="panel">${lineChart(dates,series).replace('<div class="legend"','<div class="legend" style="padding:14px 16px 0"')}</div>`;
  html+=`<p class="note">Hover or tap the chart for each day's totals. The day-by-day numbers are also in the table at the bottom of the Leaderboard tab.</p>`;
  return html+`</div>`;
}

function vDraft(){
  if(!league) return noLeague();
  const n=league.players.length,total=n*league.rounds,idx=league.picks.length,done=idx>=total;
  let html=`<div class="stack">`;
  const meIdx=league.players.indexOf(me);
  if(!done && meIdx<0){
    html+=`<div class="panel pad stack" style="gap:10px"><h3>Who are you?</h3><p class="note" style="margin:0">Tap your name. This device remembers it, so the site can tell you when it's your turn.</p>
      <div class="inline-confirm">${league.players.map(p=>`<button data-me="${esc(p)}">${esc(p)}</button>`).join("")}</div></div>`;
  } else if(meIdx>=0){
    html+=`<div class="note">Drafting as <b>${esc(me)}</b> · <button id="changeMe" class="linkbtn">Not you?</button></div>`;
  }
  if(!done){
    const pi=pickInfo(idx), mine=pi.player===meIdx, myTurn=mine||canAdmin;
    html+=`<div class="clock"><div style="min-width:0"><div class="label">${mine?"You're on the clock":"On the clock"}</div><div class="who">${mine?"<em>Your pick</em>":esc(league.players[pi.player])}</div></div>
      <div class="pk"><div class="label">Round ${pi.round+1} of ${league.rounds}</div>Pick ${idx+1}<span class="muted" style="color:inherit;opacity:.6"> / ${total}</span></div></div>`;
    if(selTeam){
      html+=`<div class="confirm"><div>Draft <b>${esc(T[selTeam].n)}</b> for <b>${esc(league.players[pi.player])}</b>?</div>
        <div class="inline-confirm"><button id="cancelPick">Cancel</button><button class="primary" id="confirmPick">Confirm pick</button></div></div>`;
    }
    const avail=TEAMS.filter(t=>!ownerOf(t.a));
    const list=avail.filter(t=>confFilter==="ALL"||t.c===confFilter).sort((x,y)=>proj(y.a)-proj(x.a)||x.n.localeCompare(y.n));
    html+=`<div class="sec-head"><div><h3>Available teams · ${avail.length} left</h3><div class="label" style="margin-top:4px">Sorted by expected wins · ${LINE_SRC}</div></div><div class="conf-tabs">${["ALL","E","W"].map(c=>`<button class="seg" data-conf="${c}" aria-pressed="${confFilter===c}">${c==="ALL"?"All":c==="E"?"East":"West"}</button>`).join("")}</div></div>
      <div class="picker">${list.map((t,k)=>{const r=rec(t.a);return `<button class="tbtn" data-team="${t.a}" ${!canWrite||!myTurn?"disabled":""} aria-pressed="${selTeam===t.a}"><span class="rk num">${k+1}</span>${dot(t.a)}<span class="tn">${esc(t.n)}<small class="num">${r.w}-${r.l} now · line ${LINE[t.a]}</small></span><span class="pj num">${f1(proj(t.a))}<small>exp. W</small></span></button>`}).join("")}</div>`;
    if(!canWrite) html+=unlockBox("Enter the league password to make picks. Your admin password works too.");
    else if(!myTurn) html+=`<p class="note">Waiting for <b>${esc(league.players[pi.player])}</b> to pick. The teams unlock when it's your turn.</p>`;
    else if(!mine) html+=`<p class="note">Commissioner mode: you can make this pick for ${esc(league.players[pi.player])}.</p>`;
  } else {
    html+=`<div class="clock"><div><div class="label">Draft complete</div><div class="who">All ${total} picks are in</div></div><a class="btn" href="#board" style="text-decoration:none">Leaderboard</a></div>`;
  }
  // board
  html+=`<div class="sec-head"><h3>Draft board</h3><span class="label">Snake order · round 3 repeats round 2's order</span></div>
   <div class="panel tbl-wrap"><table class="dboard"><thead><tr><th>Round</th>${league.players.map(p=>`<th${p===me?' style="color:var(--accent)"':""}>${esc(p)}${p===me?" (you)":""}</th>`).join("")}</tr></thead><tbody>`;
  for(let r=0;r<league.rounds;r++){
    html+=`<tr><td>R${r+1} ${forward(r)?"→":"←"}</td>`;
    for(let p=0;p<n;p++){
      const pos=forward(r)?p:n-1-p, k=r*n+pos, pk=league.picks[k];
      html+=`<td>${pk?`<span class="cell">${dot(pk.t)}${pk.t}</span>`:k===idx?`<span class="cell now">● #${k+1}</span>`:`<span class="cell open muted">#${k+1}</span>`}</td>`;
    }
    html+=`</tr>`;
  }
  html+=`</tbody></table></div>`;
  if(idx>0 && canWrite){
    const last=league.picks[idx-1];
    html+= confirmUndo
      ? `<div class="inline-confirm"><span>Undo ${esc(league.players[last.p])}'s pick of ${esc(T[last.t].n)}?</span><button id="undoNo">Keep it</button><button class="danger" id="undoYes">Undo pick</button></div>`
      : `<div><button id="undoAsk">Undo last pick</button></div>`;
  }
  return html+`</div>`;
}

function vTeams(){
  const conf=c=>{
    const list=TEAMS.filter(t=>t.c===c).map(t=>({...t,...rec(t.a)})).sort((x,y)=>{
      const px=(x.w+x.l)?x.w/(x.w+x.l):0,py=(y.w+y.l)?y.w/(y.w+y.l):0;return py-px||y.w-x.w||x.n.localeCompare(y.n)});
    return `<div class="stack" style="gap:10px"><h3>${c==="E"?"Eastern":"Western"} Conference</h3><div class="panel tbl-wrap"><table>
     <thead><tr><th>Team</th><th class="r">W</th><th class="r">L</th><th class="r hide-sm">Pct</th><th class="r hide-sm">Line</th><th class="r">Exp. W</th><th>Drafted by</th></tr></thead><tbody>
     ${list.map(t=>`<tr><td><span class="tname">${dot(t.a)}${esc(t.n)}</span></td>
       ${editWins?`<td class="r"><input type="number" min="0" max="82" id="w-${t.a}" value="${t.w}" style="width:64px"></td><td class="r"><input type="number" min="0" max="82" id="l-${t.a}" value="${t.l}" style="width:64px"></td>`
       :`<td class="r">${t.w}</td><td class="r">${t.l}</td>`}
       <td class="r hide-sm">${fmtPct((t.w+t.l)?t.w/(t.w+t.l):0)}</td><td class="r muted hide-sm">${LINE[t.a]}</td><td class="r"><b>${f1(proj(t.a))}</b></td><td>${esc(ownerOf(t.a)||"")}</td></tr>`).join("")}
     </tbody></table></div></div>`;
  };
  let head=`<div class="sec-head"><h2>All 30 teams</h2>`;
  if(canAdmin) head+= editWins?`<div class="inline-confirm"><button id="editCancel">Cancel</button><button class="primary" id="editSave">Save wins</button></div>`:`<button id="editStart">Edit wins by hand</button>`;
  head+=`</div>`;
  if(!canAdmin) head+=`<details class="note"><summary>Commissioner? Unlock to edit wins by hand</summary><div style="margin-top:8px">${unlockBox("Enter the commissioner password.")}</div></details>`;
  const src=standings?.updatedAt?`<p class="note">Win totals ${standings.source==="manual"?"entered by hand":"updated automatically from NBA standings (checked every 10 minutes while the site is open)"} on ${new Date(standings.updatedAt).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}.</p>`:`<p class="note">No win totals recorded yet. They load automatically the next time someone opens the site.</p>`;
  return `<div class="stack">${head}${src}<p class="note" style="margin-top:-10px">Exp. W is wins so far plus each remaining game at the team's preseason pace. ${LINE_SRC}.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:18px">${conf("E")}${conf("W")}</div></div>`;
}

function vSetup(){
  if(league){
    return `<div class="stack"><h2>League setup</h2>
     <div class="panel pad stack" style="gap:12px">
      <div><span class="label">Players, in first-round order</span><div style="margin-top:4px">${league.players.map((p,i)=>`${i+1}. ${esc(p)}`).join(" · ")}</div></div>
      <div><span class="label">Teams per player</span><div>${league.rounds}</div></div>
      <div><span class="label">Status</span><div>${league.status==="complete"?"Draft complete":"Drafting · "+league.picks.length+" of "+league.players.length*league.rounds+" picks made"}</div></div>
     </div>
     <div class="panel pad stack" style="gap:10px"><h3>Practice runs</h3><p class="note" style="margin:0">Did a trial draft? <b>Restart the draft</b> clears every pick but keeps the same players and order. <b>Start over</b> deletes the league so you can enter new names.</p>
     ${canAdmin?(confirmReset?`<div class="confirm"><div>${confirmReset==="restart"?"Clear all "+league.picks.length+" picks and restart the draft with the same players?":"Delete this league and its draft picks? Win history is kept."}</div><div class="inline-confirm"><button id="resetNo">Cancel</button><button class="danger" id="resetYes">${confirmReset==="restart"?"Clear picks":"Delete league"}</button></div></div>`
       :`<div class="inline-confirm"><button id="restartAsk">Restart the draft</button><button class="danger" id="resetAsk">Start over with a new league</button></div>`):unlockBox("Enter the commissioner (admin) password to restart or reset the league.")}</div>
    </div>`;
  }
  if(!draftForm){try{draftForm=JSON.parse(localStorage.getItem("nbawd-form"))}catch{}; if(!draftForm||!Array.isArray(draftForm.players))draftForm={players:["",""]}}
  const n=draftForm.players.length, rounds=roundsFor(n);
  return `<div class="stack"><div class="sec-head"><h2>Set up the league</h2><span class="label">2026–27 season</span></div>
   <div class="panel pad stack">
    <div class="stack" style="gap:8px"><h3>Who's drafting?</h3><p class="note" style="margin:0">List players in first-round order, or shuffle for a random order. Round 1 goes first to last, round 2 last to first, and round 3 last to first again, so whoever picks last in round 1 gets back-to-back picks then leads off round 3. A 4th round goes first to last.</p></div>
    <div class="plist">${draftForm.players.map((p,i)=>`<div class="prow"><span class="n num">${i+1}</span>
      <input id="pl-${i}" data-pl="${i}" value="${esc(p)}" placeholder="Player ${i+1} name" maxlength="24" aria-label="Player ${i+1} name">
      <button data-up="${i}" ${i===0?"disabled":""} aria-label="Move up">↑</button><button data-down="${i}" ${i===n-1?"disabled":""} aria-label="Move down">↓</button>
      <button data-rm="${i}" ${n<=2?"disabled":""} aria-label="Remove">✕</button></div>`).join("")}</div>
    <div class="inline-confirm"><button id="addPl" ${n>=10?"disabled":""}>+ Add player</button><button id="shuffle">Shuffle order</button></div>
    <div class="opts"><div><span class="label">Teams per player</span><div class="big num">${rounds}</div></div>
      <div class="note">Everyone drafts the same number of teams: 4 each with up to 6 players, 3 each with 7 or more.<br>${n} players × ${rounds} teams = ${n*rounds} of 30 teams drafted.</div></div>
    <p class="note" style="margin:0"><b>Names are saved for everyone when you click Start the draft.</b> Until then they're only on this device.</p>
    ${canWrite?`<div><button class="primary" id="startDraft">Start the draft</button></div>`:unlockBox("Step 1: enter the league password (your admin password works too). Step 2: click Start the draft.")}
   </div></div>`;
}

/* ---------- render ---------- */
function defaultTab(){return !league?"setup":league.status==="complete"?"board":"draft"}
function render(){
  const h=location.hash.slice(1);
  tab=["board","matchups","analytics","draft","teams","setup"].includes(h)?h:defaultTab();
  document.querySelectorAll("#nav a").forEach(a=>a.dataset.tab===tab?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  $("#asOf").textContent = standings?.updatedAt?"Wins updated "+new Date(standings.updatedAt).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";
  canWrite=canWriteF(); canAdmin=canAdminF();
  $("#who").innerHTML = role?`${role==="admin"?"Commissioner":"Player"} · <button id="lockBtn" class="linkbtn">Lock</button>`:"";
  if(netErr){ $("#main").innerHTML=`<div class="panel empty"><h2>Can't reach the league</h2><p class="muted">${esc(netErr)} The page retries on its own.</p></div>`; return; }
  if(!leagueLoaded) return;
  const active=document.activeElement?.id;
  $("#main").innerHTML = tab==="board"?vBoard():tab==="matchups"?vMatchups():tab==="analytics"?vAnalytics():tab==="draft"?vDraft():tab==="teams"?vTeams():vSetup();
  if(tab==="analytics")wireChart();
  if(active&&document.getElementById(active)&&active.startsWith("pl-")) document.getElementById(active).focus();
}
let rsz;window.addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(tab==="analytics")render()},150)});
window.addEventListener("hashchange",()=>{selTeam=null;confirmUndo=false;confirmReset=false;render();window.scrollTo(0,0)});

/* ---------- server ---------- */
let pw=""; try{pw=localStorage.getItem("nbawd-pw")||""}catch{}
function savePw(v){pw=v;try{v?localStorage.setItem("nbawd-pw",v):localStorage.removeItem("nbawd-pw")}catch{}}
function applyState(st){
  if(!st)return;
  league=st.league||null; standings=st.standings||null; history=st.history||[]; slate=st.games||null; roast=st.roast||null; leagueLoaded=true;
  if(league&&selTeam&&ownerOf(selTeam))selTeam=null;
  render();
}
async function refresh(){
  try{const r=await fetch("/api/state",{cache:"no-store"});
    if(r.ok){netErr=false;applyState(await r.json());return}
    const j=await r.json().catch(()=>null); throw (j&&j.error)||("The server answered "+r.status+(r.status===404?". The api folder may be missing from GitHub.":"."));}
  catch(e){if(!leagueLoaded){netErr=typeof e==="string"?e:"Check your connection.";render()}}
}
async function api(action,body={}){
  const r=await fetch("/api/action",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action,password:pw,...body})});
  const j=await r.json().catch(()=>({}));
  if(j.state)applyState(j.state);
  if(r.status===401){if(action!=="check"){savePw("");role=null;render()}throw {code:"auth",message:j.error||"Wrong password."}}
  if(!r.ok)throw {code:j.code||"error",message:j.error||"Couldn't save. Try again."};
  return j;
}
function writeFail(e){toast(e?.message||"Couldn't save. Check your connection and try again.")}
async function unlock(){
  const v=(document.getElementById("pw")?.value||"").trim(); if(!v){toast("Enter the password.");return}
  const old=pw; pw=v;
  try{const j=await api("check");role=j.role;savePw(v);toast(role==="admin"?"Unlocked as commissioner":"Unlocked. You can make picks.");render()}
  catch(e){pw=old;toast(e.code==="auth"?"That password didn't work.":e.message)}
}
async function makePick(team){
  try{
    const j=await api("pick",{team,expected:league.picks.length});
    const last=j.state.league.picks.at(-1);
    toast(`${j.state.league.players[last.p]} takes the ${T[team].n.split(" ").slice(-1)[0]}`);
    selTeam=null;
  }catch(e){selTeam=null;writeFail(e)}
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="unlockBtn"){await unlock();return}
  if(b.dataset.me){me=b.dataset.me;try{localStorage.setItem("nbawd-me",me)}catch{};selTeam=null;render();return}
  if(b.id==="changeMe"){me=null;try{localStorage.removeItem("nbawd-me")}catch{};selTeam=null;render();return}
  if(b.id==="lockBtn"){savePw("");role=null;render();return}
  if(b.dataset.team){selTeam=selTeam===b.dataset.team?null:b.dataset.team;render();return}
  if(b.dataset.conf){confFilter=b.dataset.conf;render();return}
  if(b.dataset.chart){chartMode=b.dataset.chart;render();return}
  if(b.id==="cancelPick"){selTeam=null;render();return}
  if(b.id==="confirmPick"){b.disabled=true;await makePick(selTeam);render();return}
  if(b.id==="undoAsk"){confirmUndo=true;render();return}
  if(b.id==="undoNo"){confirmUndo=false;render();return}
  if(b.id==="undoYes"){confirmUndo=false;try{await api("undo",{expected:league.picks.length});toast("Last pick undone")}catch(err){writeFail(err)}render();return}
  if(b.id==="resetAsk"){confirmReset="new";render();return}
  if(b.id==="restartAsk"){confirmReset="restart";render();return}
  if(b.id==="resetNo"){confirmReset=false;render();return}
  if(b.id==="resetYes"){const mode=confirmReset;confirmReset=false;try{if(mode==="restart"){await api("restart");location.hash="#draft";toast("Draft restarted")}else{await api("reset");draftForm=null;saveForm();location.hash="#setup";toast("League deleted")}}catch(err){writeFail(err)}render();return}
  if(b.id==="editStart"){editWins=true;render();return}
  if(b.id==="editCancel"){editWins=false;render();return}
  if(b.id==="editSave"){await saveWins(b);return}
  if(!draftForm)return;
  const P=draftForm.players; setTimeout(saveForm,0);
  if(b.id==="addPl"){P.push("");render();document.getElementById("pl-"+(P.length-1))?.focus();return}
  if(b.id==="shuffle"){for(let i=P.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[P[i],P[j]]=[P[j],P[i]]}render();return}
  if(b.dataset.rm){P.splice(+b.dataset.rm,1);render();return}
  if(b.dataset.up){const i=+b.dataset.up;[P[i-1],P[i]]=[P[i],P[i-1]];render();return}
  if(b.dataset.down){const i=+b.dataset.down;[P[i+1],P[i]]=[P[i],P[i+1]];render();return}
  if(b.id==="startDraft"){
    const names=P.map(s=>s.trim()).filter(Boolean);
    if(names.length<2){toast("Add at least two players.");return}
    if(new Set(names.map(s=>s.toLowerCase())).size!==names.length){toast("Each player needs a different name.");return}
    const rounds=roundsFor(names.length);
    b.disabled=true;
    try{await api("setup",{players:names,rounds});location.hash="#draft"}
    catch(err){b.disabled=false;writeFail(err)}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pw"){e.preventDefault();unlock()}});
function saveForm(){try{draftForm?localStorage.setItem("nbawd-form",JSON.stringify(draftForm)):localStorage.removeItem("nbawd-form")}catch{}}
document.addEventListener("input",e=>{
  if(e.target.dataset.pl!=null&&draftForm){draftForm.players[+e.target.dataset.pl]=e.target.value;saveForm()}
});

async function saveWins(b){
  const teams={};
  for(const t of TEAMS){
    const w=parseInt(document.getElementById("w-"+t.a).value,10),l=parseInt(document.getElementById("l-"+t.a).value,10);
    if(!(w>=0&&w<=82&&l>=0&&l<=82&&w+l<=82)){toast(`Check the record for the ${t.n}.`);return}
    teams[t.a]={w,l};
  }
  b.disabled=true;
  try{await api("wins",{teams,date:todayISO()});editWins=false;toast("Wins saved");render()}
  catch(err){b.disabled=false;writeFail(err)}
}

/* ---------- boot ---------- */
render();
(async()=>{
  await refresh();
  if(pw){try{const j=await api("check");role=j.role}catch{savePw("")}render()}
  const loop=async()=>{ if(!document.hidden) await refresh(); setTimeout(loop, (!leagueLoaded||league?.status==="drafting")?4000:60000) };
  setTimeout(loop,4000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
})();
</script>

</body>
</html>
